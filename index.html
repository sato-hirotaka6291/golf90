<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17351f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="90台ゴルフ">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>90台ゴルフ</title>
<style>
:root{--bg:#f4f6f1;--card:#fff;--text:#142017;--muted:#6d776f;--line:#dce3da;--green:#176b35;--pale:#e9f3eb;--red:#a62c2c;--amber:#9a6500}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{touch-action:manipulation}
.app{max-width:720px;margin:auto;padding:10px 10px 112px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.head h1{font-size:21px;margin:0}.sub{font-size:12px;color:var(--muted)}
.top{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;text-align:center;padding:9px 4px}.stat b{display:block;font-size:22px}.stat span{font-size:10px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px;margin-top:9px}.title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}.title h2{font-size:17px;margin:0}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;min-height:44px;padding:9px 12px;font-weight:750}.primary{background:var(--green);color:#fff;border-color:var(--green)}.soft{background:var(--pale);color:#15582d;border-color:#cfe0d2}
.holebar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}label{font-size:11px;color:var(--muted)}select,input,textarea{width:100%;min-height:44px;margin-top:4px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:9px;font-size:16px}textarea{min-height:70px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.q{border:1px solid var(--line);background:#fff;border-radius:12px;min-height:48px;padding:7px 3px;font-weight:750;color:#1471e8}.q.active{background:var(--pale);border:2px solid var(--green);color:#15582d}.q.bad{color:var(--red)}.q.good{color:var(--green)}
.more{margin-top:9px}.more summary{list-style:none;cursor:pointer;font-weight:700;color:var(--muted);padding:8px 0}.more summary::-webkit-details-marker{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shot{border-top:1px solid var(--line);padding:8px 0;font-size:13px}.shot:first-child{border-top:0}.shotline{display:flex;justify-content:space-between;gap:8px}.badtext{color:var(--red);font-weight:800}
.holes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.hole{border:1px solid var(--line);background:#fff;border-radius:10px;min-height:48px;padding:5px 2px}.hole.cur{outline:2px solid var(--green)}.hole .n{font-size:10px;color:var(--muted)}.hole .s{font-weight:850}.hole.triple{background:#fff0f0}.hole.double{background:#fff8e8}
.analysis{font-size:14px;line-height:1.6}.tag{display:inline-block;background:var(--pale);border-radius:999px;padding:4px 8px;margin:3px 3px 0 0;font-size:11px}
.bottom{position:fixed;z-index:20;left:0;right:0;bottom:0;background:rgba(244,246,241,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}.bottomin{max-width:720px;margin:auto;display:grid;grid-template-columns:.8fr 1.4fr;gap:8px}.bottom .btn{min-height:55px;font-size:17px}
.modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);padding:20px;overflow:auto}.modalbox{max-width:680px;margin:30px auto;background:#fff;border-radius:18px;padding:15px}.modal textarea{min-height:360px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:#152019;color:#fff;border-radius:999px;padding:9px 14px;font-size:13px;display:none;z-index:40}
@media(max-width:390px){.top{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
 <div class="head"><div><h1>90台ゴルフ</h1><div class="sub">クラブ → 結果 → 記録。詳細は必要な時だけ。</div></div><button class="btn" id="newRound">新規</button></div>
 <div class="top">
  <div class="stat"><b id="total">0</b><span>TOTAL</span></div><div class="stat"><b id="played">0</b><span>HOLES</span></div>
  <div class="stat"><b id="bad">0</b><span>事故</span></div><div class="stat"><b id="penalty">0</b><span>OB・池</span></div>
 </div>
 <section class="card">
  <div class="title"><h2 id="holeTitle">1H・1打目</h2><button class="btn" id="undo">1打戻す</button></div>
  <div class="holebar"><label>Hole<select id="hole"></select></label><label>Par<select id="par"><option>3</option><option selected>4</option><option>5</option></select></label><label>Score<input id="score" type="number" inputmode="numeric" min="1" max="15" placeholder="例 5"></label></div>
 </section>
 <section class="card">
  <div class="title"><h2>① クラブ</h2><div class="sub">1タップ</div></div><div class="quick" id="clubs"></div>
  <div class="title" style="margin-top:13px"><h2>② 結果</h2><div class="sub">基本は○</div></div><div class="quick" id="results"></div>
  <details class="more"><summary>＋ 距離・ライ・メモを追加（任意）</summary>
   <div class="row"><label>残り距離<input id="distance" type="number" inputmode="numeric" min="0" max="700" placeholder="yd"></label><label>ライ<select id="lie"><option>ティー</option><option>FW</option><option>ラフ</option><option>バンカー</option><option>カラー</option><option>グリーン</option><option>その他</option></select></label></div>
   <label style="display:block;margin-top:8px">メモ<input id="memo" placeholder="例：力んだ / 安全に刻んだ"></label>
  </details>
 </section>
 <section class="card"><div class="title"><h2>このホール</h2><div class="sub" id="shotMini">0打記録</div></div><div id="shots"></div></section>
 <section class="card">
  <div class="title"><h2>ホールアウト</h2><button class="btn soft" id="finishHole">保存して次H</button></div>
  <div class="quick" id="ratings"><button class="q active" data-r="○">○ ボギー圏</button><button class="q" data-r="◎">◎ 狙い通り</button><button class="q" data-r="△">△ 事故あり</button><button class="q bad" data-r="×">× 大事故</button></div>
  <details class="more"><summary>＋ ホール総括を書く（任意）</summary><textarea id="holeMemo" placeholder="例：2打目4UTチョロ。次は6UTで刻む"></textarea></details>
 </section>
 <section class="card"><div class="title"><h2>18ホール</h2><button class="btn" id="export">ChatGPT分析</button></div><div class="holes" id="holes"></div></section>
 <section class="card"><div class="title"><h2>90台チェック</h2></div><div class="analysis" id="analysis"></div></section>
</div>
<div class="bottom"><div class="bottomin"><button class="btn" id="next">次ホール</button><button class="btn primary" id="add">③ この1打を記録</button></div></div>
<div class="toast" id="toast">記録しました</div>
<div class="modal" id="modal"><div class="modalbox"><div class="title"><h2>ChatGPT分析用データ</h2><button class="btn" id="close">閉じる</button></div><div class="sub">「全文を選択」を押し、iPhoneのコピー操作で全文をコピーしてChatGPTへ貼り付けてください。</div><textarea id="exportText" readonly></textarea><button class="btn primary" style="width:100%;margin-top:8px" id="selectAll">全文を選択</button></div></div>
<script>
(()=>{
const KEY='golf90_round_tracker_v1';
const clubs=['1W','5W','4UT','6UT','7I','8I','9I','PW','52°','58°','チッパー','パター'];
const results=['○ 想定内','右','左','チョロ','シャンク','トップ','ダフリ','OB/池','ショート','オーバー','バンカー'];
const badSet=new Set(results.filter(x=>x!=='○ 想定内'));
const blank=()=>({currentHole:1,holes:Array.from({length:18},(_,i)=>({hole:i+1,par:4,score:null,shots:[],rating:'○',memo:''}))});
let state=load()||blank(), club='1W', result='○ 想定内', rating='○';
const $=x=>document.querySelector(x), hole=$('#hole'),par=$('#par'),score=$('#score'),distance=$('#distance'),lie=$('#lie'),memo=$('#memo'),holeMemo=$('#holeMemo');
for(let i=1;i<=18;i++){let o=document.createElement('option');o.value=i;o.textContent=i+'H';hole.appendChild(o)}
clubs.forEach((x,i)=>{let b=document.createElement('button');b.className='q'+(i===0?' active':'');b.dataset.club=x;b.textContent=x;$('#clubs').appendChild(b)});
results.forEach((x,i)=>{let b=document.createElement('button');b.className='q '+(x==='○ 想定内'?'good':'bad')+(i===0?' active':'');b.dataset.result=x;b.textContent=x;$('#results').appendChild(b)});
function load(){try{let x=localStorage.getItem(KEY);return x?JSON.parse(x):null}catch(e){return null}}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function h(){return state.holes[state.currentHole-1]} function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function active(root,attr,val){root.querySelectorAll('.q').forEach(b=>b.classList.toggle('active',b.dataset[attr]===val))}
function toast(t){let x=$('#toast');x.textContent=t;x.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>x.style.display='none',1100)}
function loadHole(){let x=h();hole.value=state.currentHole;par.value=x.par;score.value=x.score??'';holeMemo.value=x.memo||'';rating=x.rating||'○';active($('#ratings'),'r',rating);render()}
function add(){let x=h(),d=distance.value===''?null:Math.max(0,Math.min(700,Number(distance.value)||0));x.shots.push({club,result,distance:d,lie:lie.value,memo:memo.value.trim()});distance.value='';memo.value='';result='○ 想定内';active($('#results'),'result',result);if(x.shots.length===1&&club==='1W')lie.value='FW';save();render();toast(`${state.currentHole}H ${x.shots.length}打目を記録`)}
function finish(){let x=h();x.par=Number(par.value)||4;x.score=score.value===''?x.shots.length:Math.max(1,Math.min(15,Number(score.value)||x.shots.length));x.rating=rating;x.memo=holeMemo.value.trim();save();if(state.currentHole<18){state.currentHole++;loadHole();window.scrollTo({top:0,behavior:'smooth'})}else render()}
function renderShots(){let root=$('#shots'),x=h();root.innerHTML=x.shots.length?'':'<div class="sub">まだ記録なし</div>';x.shots.forEach((s,i)=>{let d=document.createElement('div');d.className='shot';d.innerHTML=`<div class="shotline"><strong>${i+1}打目 ${esc(s.club)}</strong><span class="${badSet.has(s.result)?'badtext':''}">${esc(s.result)}</span></div><div class="sub">${s.distance!==null?'残り'+s.distance+'yd ・ ':''}${esc(s.lie)}${s.memo?' ・ '+esc(s.memo):''}</div>`;root.appendChild(d)})}
function renderHoles(){let root=$('#holes');root.innerHTML='';state.holes.forEach(x=>{let b=document.createElement('button');b.className='hole'+(x.hole===state.currentHole?' cur':'');if(x.score!==null){let d=x.score-x.par;if(d>=3)b.className+=' triple';else if(d===2)b.className+=' double'}b.innerHTML=`<div class="n">${x.hole}H</div><div class="s">${x.score??'—'}</div>`;b.onclick=()=>{state.currentHole=x.hole;loadHole();window.scrollTo({top:0,behavior:'smooth'})};root.appendChild(b)})}
function render(){let played=state.holes.filter(x=>x.score!==null),shots=state.holes.flatMap(x=>x.shots),bad=shots.filter(s=>badSet.has(s.result)),pen=shots.filter(s=>s.result==='OB/池').length,triples=played.filter(x=>x.score-x.par>=3).length;
$('#total').textContent=played.reduce((a,x)=>a+x.score,0)||0;$('#played').textContent=played.length;$('#bad').textContent=bad.length;$('#penalty').textContent=pen;$('#holeTitle').textContent=`${state.currentHole}H・${h().shots.length+1}打目`;$('#shotMini').textContent=`${h().shots.length}打記録`;
let cm={},mm={},pos={};bad.forEach(s=>{cm[s.club]=(cm[s.club]||0)+1;mm[s.result]=(mm[s.result]||0)+1});state.holes.forEach(x=>x.shots.forEach((s,i)=>{if(badSet.has(s.result))pos[i+1]=(pos[i+1]||0)+1}));
let top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0];let c=top(cm),m=top(mm),p=top(pos);
$('#analysis').innerHTML=`<div>${pen<=2?'✓':'△'} OB・池：<strong>${pen}回</strong> / 目安2回以内</div><div>${triples<=3?'✓':'△'} トリ以上：<strong>${triples}H</strong> / 目安3H以内</div>${m?`<div>最多ミス：<strong>${esc(m[0])} ${m[1]}回</strong></div>`:''}${c?`<div>事故最多クラブ：<strong>${esc(c[0])} ${c[1]}回</strong></div>`:''}${p?`<div>事故が多い打順：<strong>${p[0]}打目 ${p[1]}回</strong></div>`:''}<div><span class="tag">記録 ${shots.length}打</span><span class="tag">事故 ${bad.length}打</span></div>`;
renderShots();renderHoles()}
function exportData(){let lines=['【90台ゴルフ・ラウンド分析依頼】','次のショット記録から、①失った打数が大きい原因 ②事故が多いクラブ・打順・距離帯 ③良かった点 ④次回の改善優先順位3つ ⑤90台に入るため削れそうな打数 を分析してください。',''];state.holes.forEach(x=>{if(x.score===null&&!x.shots.length)return;lines.push(`${x.hole}H / Par${x.par} / Score ${x.score??'-'} / ${x.rating}`);x.shots.forEach((s,i)=>lines.push(`  ${i+1}打目 ${s.club} / ${s.result}${s.distance!==null?' / 残り'+s.distance+'yd':''} / ${s.lie}${s.memo?' / '+s.memo:''}`));if(x.memo)lines.push('  総括: '+x.memo);lines.push('')});$('#exportText').value=lines.join('\n');$('#modal').style.display='block'}
$('#clubs').onclick=e=>{let b=e.target.closest('[data-club]');if(b){club=b.dataset.club;active($('#clubs'),'club',club)}};$('#results').onclick=e=>{let b=e.target.closest('[data-result]');if(b){result=b.dataset.result;active($('#results'),'result',result)}};$('#ratings').onclick=e=>{let b=e.target.closest('[data-r]');if(b){rating=b.dataset.r;active($('#ratings'),'r',rating)}};
$('#add').onclick=add;$('#undo').onclick=()=>{if(h().shots.length){h().shots.pop();save();render();toast('1打戻しました')}};hole.onchange=()=>{state.currentHole=Number(hole.value);loadHole()};$('#next').onclick=()=>{if(state.currentHole<18){state.currentHole++;loadHole();window.scrollTo({top:0,behavior:'smooth'})}};$('#finishHole').onclick=finish;
$('#newRound').onclick=()=>{if(confirm('現在の記録を消して新しいラウンドを開始しますか？')){state=blank();club='1W';result='○ 想定内';save();loadHole()}};
$('#export').onclick=exportData;$('#close').onclick=()=>$('#modal').style.display='none';$('#selectAll').onclick=()=>{$('#exportText').focus();$('#exportText').select()};
loadHole();
})();
</script>
<script>if('serviceWorker'in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script>
</body></html>
